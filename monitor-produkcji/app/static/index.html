<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Produkcji</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="dot" id="conn" title="Połączenie"></span>
    <h1>Monitor Produkcji</h1>
    <span class="plant" id="plant"></span>
  </div>
  <div class="shift" id="shift"></div>
  <nav>
    <button data-view="dash" class="active">Hala</button>
    <button data-view="report">Raport zmiany</button>
    <button data-view="alarms">Alarmy</button>
  </nav>
  <div class="clock" id="clock"></div>
</header>

<div id="alarmbar" class="alarmbar hidden"></div>

<main>
  <section id="view-dash" class="view">
    <div class="summary" id="summary"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="view-report" class="view hidden">
    <div class="toolbar">
      <label>Data <input type="date" id="r-date"></label>
      <label>Zmiana <select id="r-shift"></select></label>
      <button id="r-load">Pokaż</button>
      <a id="r-csv" class="btn" href="#">Eksport CSV</a>
    </div>
    <div id="report"></div>
  </section>

  <section id="view-alarms" class="view hidden">
    <table class="tbl" id="alarm-tbl"></table>
  </section>
</main>

<div id="drawer" class="drawer hidden">
  <div class="drawer-inner">
    <button class="close" id="drawer-close" aria-label="Zamknij">×</button>
    <div id="detail"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
